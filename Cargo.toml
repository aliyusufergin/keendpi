[package]
name = "keendpi"
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Small DPI-circumvention engine for Keenetic routers (NFQUEUE)"
repository = "https://github.com/aliyusufergin/keendpi"
readme = "README.en.md"

[dependencies]
nfq = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
