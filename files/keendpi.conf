# keendpi configuration. Shell syntax (KEY=value); the init script reads this file too.
# After a change: /opt/etc/init.d/S51keendpi restart   (list files are re-read automatically)
# Your own domains: add a new .txt file in /opt/etc/keendpi/lists/ (default.txt is replaced on upgrade).

# Start the service (at boot, after install and on upgrade). no = installed but off.
ENABLED=yes

# Which connections get the bypass:
#   list  only domains in the LISTS files
#   auto  LISTS plus domains learned when the ISP resets a connection (default)
#   all   every connection, except EXCLUDE
MODE=auto

# Domain lists, one domain per line; a domain also covers its subdomains.
# Directories mean every *.txt file in them.
LISTS=/opt/etc/keendpi/lists
# Domains that never get the bypass, in any mode.
EXCLUDE=/opt/etc/keendpi/exclude.txt
# Where auto mode writes the domains it learned. Delete a line to forget it.
AUTO_LIST=/opt/etc/keendpi/auto.txt

# Also handle plain HTTP (port 80) requests.
HTTP=yes

# Strategy: one fake request with a harmless name, sent with a low TTL so it dies before the
# server. TTL counts hops from the router (Türksat Kablonet: 2 or 3 work). It is lowered
# automatically for servers closer than that.
TTL=3
FAKE_HOST=www.google.com

# Internet interface(s). auto = the interface of the default route (PPPoE: ppp0).
# Several can be given, separated by spaces.
WAN=auto

# Log every handled connection to the system log (for troubleshooting; noisy).
VERBOSE=no

# Plumbing; change only if they clash with something else on the router.
QUEUE=200
MARK=0x40000000
FORCE_MARK=0x20000000
